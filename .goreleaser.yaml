# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: traits

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: traits
    main: ./cmd/traits
    binary: traits
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: traits
    # Version-free names so .../releases/latest/download/<name> works (action.yml).
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: talbet
    name: traits
